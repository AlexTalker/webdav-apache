name: Build & deploy release Docker image
on:
  # GitHub Actions doesn't support YAML anchors, hence duplication
  workflow_call:
    inputs:
      release:
        description: 'Apache release date'
        type: string
        default: '2.4.65-trixie'
      image:
        description: 'Image name'
        type: string
        default: 'webdav-apache'
  workflow_dispatch:
    inputs:
      release:
        description: 'Apache release date'
        type: string
        default: '2.4.65-trixie'
      image:
        description: 'Image name'
        type: string
        default: 'webdav-apache'

jobs:
  rootfs-image:
    name: Build the release docker image
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build & publish Docker image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            APACHE_TAG=${{ inputs.release }}
          context: ./src/
          file: ./src/webdav-apache.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}:${{ inputs.release }}
